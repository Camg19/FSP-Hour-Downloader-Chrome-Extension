<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FSP Hours Downloader</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 360px;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #1f2937;
        }

        .container {
            padding: 20px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .title {
            font-size: 19px;
            font-weight: 700;
            margin: 0;
        }

        .settings-button {
            border: none;
            background: none;
            font-size: 21px;
            cursor: pointer;
            padding: 4px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 11px 12px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        input[type="date"],
        select {
            width: 100%;
            padding: 10px 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: white;
            font-size: 14px;
            color: #111827;
        }

        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        input:disabled {
            background: #e5e7eb;
            color: #9ca3af;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 20px 0;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .checkbox-row label {
            margin: 0;
            font-weight: 400;
            font-size: 13px;
        }

        .download-button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 12px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .download-button:hover {
            background: #1d4ed8;
        }

        .download-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .message {
            min-height: 18px;
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
        }

        .progress-container {
            margin-top: 18px;
            padding: 14px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 9px;
            font-size: 12px;
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #2563eb;
            border-radius: 20px;
            transition: width 0.25s ease;
        }

        .progress-detail {
            margin-top: 8px;
            color: #6b7280;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-bar">
            <h1 class="title">FSP Hours Downloader</h1>

            <button
                id="settingsButton"
                class="settings-button"
                title="Settings">
                ⚙
            </button>
        </div>


        <!-- FSP connection indicator -->
        <div class="connection-status">
            <span
                id="statusDot"
                class="status-dot">
            </span>

            <span id="connectionText">
                Connected to Flight Schedule Pro
            </span>
        </div>


        <!-- Operator -->
        <div class="form-group">
            <label for="operator">
                Operator
            </label>

            <select
                id="operator"
                name="operator"
                required>

                <option value="" selected disabled>Select an operator</option>

            </select>
        </div>


        <!-- Starting date -->
        <div class="form-group">
            <label for="startDate">
                Starting Date
            </label>

            <input
                type="date"
                id="startDate"
                name="startDate">
        </div>


        <!-- Get all -->
        <div class="checkbox-row">

            <input
                type="checkbox"
                id="getAllData">

            <label for="getAllData">
                Get all available data
            </label>

        </div>


        <!-- Download -->
        <button
            type="button"
            id="downloadButton"
            class="download-button">
            Download Hours
        </button>


        <div
            id="status"
            class="message">
        </div>

        <div id="progressContainer" class="progress-container" style="display: none;">

        <div class="progress-header">
            <span id="progressText">Downloading flight data...</span>
            <span id="progressPercent">0%</span>
        </div>

        <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="progressDetail" class="progress-detail">
            Preparing download...
        </div>

    </div>

    </div>


    <script src="popup.js"></script>

</body>
</html>
